<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interval Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <nav class="app-nav">
      <a href="index.html">4-7-8 Breathing</a>
      <a href="timer.html" class="active">Interval Timer</a>
    </nav>
    <h1>Interval Timer</h1>
    <div class="breathing-card timer-card">
      <div class="timer-display">
        <strong id="elapsed">00:00</strong>
        <span id="beep-note">Beeps every 5 seconds</span>
      </div>

      <div class="controls">
        <button id="start-btn" class="toggle">Start</button>
        <button id="stop-btn" class="secondary" disabled>Stop</button>
        <button id="reset-btn" class="secondary">Reset</button>
      </div>
    </div>
  </main>

  <script src="timer.js"></script>
</body>
</html>
